name: Release

on:
  pull_request:
  push:
    branches: [main, wgpu, feat/wgpu-validation]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary_name: pacman
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary_name: pacman.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_name: pacman
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: pacman
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Check formatting and packaging tests
        run: |
          cargo fmt --check
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify wgpu dependency
        run: |
          cargo tree --locked --depth 1 > dependencies.txt
          grep -E '^.*wgpu v' dependencies.txt
          grep -E '^.*winit v' dependencies.txt

      - name: Test and lint
        run: |
          cargo test --locked --all-targets --target "${{ matrix.target }}"
          cargo clippy --locked --all-targets --target "${{ matrix.target }}" -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release --bin pacman --target "${{ matrix.target }}"

      - name: Check executable without opening a window
        run: |
          "./target/${{ matrix.target }}/release/${{ matrix.binary_name }}" --help > help.txt
          grep -F 'launches the game in a wgpu window' help.txt

      - name: Package executable and README
        env:
          BUILD_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python scripts/package_release.py --target "${{ matrix.target }}" --label "$BUILD_LABEL"

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacman-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: pacman-*
          path: dist
          merge-multiple: true

      - name: Publish archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            printf 'Expected a version tag such as v1.0.1 or v1.0.1-rc.1\n' >&2
            exit 1
          fi
          cd dist
          assets=("pacman-${tag}-aarch64-apple-darwin.tar.gz"
                  "pacman-${tag}-x86_64-pc-windows-msvc.zip"
                  "pacman-${tag}-x86_64-unknown-linux-gnu.tar.gz"
                  "pacman-${tag}-aarch64-unknown-linux-gnu.tar.gz")
          checksum_file="pacman-${tag}-SHA256SUMS.txt"
          sha256sum "${assets[@]}" > "$checksum_file"
          sha256sum --check "$checksum_file"
          assets+=("$checksum_file")
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" --verify-tag --generate-notes --draft "${flags[@]}"
          gh release upload "$tag" "${assets[@]}"
          gh release edit "$tag" --draft=false
